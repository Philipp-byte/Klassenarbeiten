<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Klassenarbeit – JJWS</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="icon" href="../../assets/logo/JJWS_Bildmarke_bunt.png">
<style>
  /* Nur in dieser App gebrauchte Ergänzungen */
  body.pruefung-laeuft { padding-bottom: 5rem; }
  .willkommen { text-align: center; padding: 1rem 0 .4rem; }
  .willkommen .marke {
    font-size: .74rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--blue-700); margin-bottom: .4rem;
  }
  .willkommen h2 { font-size: 1.7rem; margin-bottom: .4rem; }
  .willkommen p { color: var(--grey); max-width: 32rem; margin: 0 auto 1.2rem; }
  .punkte-reihe { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<header class="app-header">
  <div class="titel">
    <h1 id="kopf-titel">Klassenarbeit</h1>
    <span class="sub" id="kopf-unter"></span>
  </div>
  <div class="kopf-rechts">
    <span class="rollen-chip sus">Prüfung</span>
    <span class="uhr" id="uhr" hidden></span>
    <img class="logo" src="../../assets/logo/JJWS_Bildmarke_bunt.png" alt="Johann-Jakob-Widmann-Schule">
  </div>
</header>

<main class="wrap" id="inhalt"></main>

<div class="statusleiste" id="statusleiste" hidden></div>

<footer class="app-fuss">
  Alle Eingaben bleiben auf diesem Rechner. Es werden keine Daten übertragen.
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
